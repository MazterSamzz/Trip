name: holiday

services:
  nginx:
    image: nginx:1.29
    ports:
      - '8080:80'
    volumes:
      - ./apps/backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/html
    volumes:
      - ./apps/backend:/var/www/html

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: holiday
      MYSQL_ROOT_PASSWORD: Excusem3.
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
